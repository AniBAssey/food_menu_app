{% extends 'food_menu_app/base.html' %}

{% block title %}Delete {{ item.item_name }} | FoodMenuApp{% endblock %}

{% block content %}
    <section class="mx-auto max-w-2xl rounded-3xl border border-red-200 bg-white p-7 shadow-sm sm:p-10">
        <p class="mb-3 text-sm font-bold uppercase tracking-[0.2em] text-red-700">Menu management</p>
        <h1 class="text-3xl font-extrabold tracking-tight text-stone-950 sm:text-4xl">Delete menu item?</h1>
        <p class="mt-4 leading-7 text-stone-600">
            Are you sure you want to permanently delete <strong>{{ item.item_name }}</strong>?
        </p>

        <form method="post" class="mt-8 flex flex-wrap gap-3">
            {% csrf_token %}
            <button type="submit" class="rounded-lg bg-red-700 px-5 py-3 font-bold text-white transition hover:bg-red-800 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-red-700">
                Yes, delete item
            </button>
            <a href="{% url 'item-detail' item.id %}" class="rounded-lg border border-stone-300 px-5 py-3 font-semibold text-stone-700 hover:bg-stone-50 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-amber-600">
                Cancel
            </a>
        </form>
    </section>
{% endblock %}

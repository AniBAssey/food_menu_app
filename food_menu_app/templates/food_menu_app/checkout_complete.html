{% extends 'food_menu_app/base.html' %}

{% block title %}Payment complete | FoodMenuApp{% endblock %}

{% block content %}
    <!-- Display a receipt only after food_menu_app.views.capture_checkout_order verifies a completed capture. -->
    <section class="mx-auto max-w-2xl rounded-2xl border border-emerald-950/10 bg-white p-8 text-center shadow-sm">
        <p class="text-sm font-bold uppercase tracking-[0.2em] text-emerald-700">Payment confirmed</p>
        <h1 class="mt-3 text-4xl font-extrabold tracking-tight text-emerald-950">Thank you for your order!</h1>
        <p class="mt-4 text-stone-600">Your PayPal payment was completed successfully.</p>
        <p class="mt-3 text-sm text-stone-500">PayPal capture ID: <span class="font-mono">{{ capture_id }}</span></p>
        <a href="{% url 'index' %}" class="mt-8 inline-flex rounded-lg bg-emerald-800 px-5 py-3 font-semibold text-white transition hover:bg-emerald-900">
            Back to menu
        </a>
    </section>
{% endblock %}
